[tools]
rust = "1.99.1"

[settings]
auto_install = false

[env]
RUSTUP_AUTO_INSTALL = "0"

[tasks.fmt]
run = ["sh scripts/check-rust-toolchain.sh", "cargo fmt --all -- --check"]

[tasks.lint]
run = ["sh scripts/check-rust-toolchain.sh", "cargo clippy --workspace --all-targets --locked -- -D warnings"]

[tasks."test:core"]
run = ["sh scripts/check-rust-toolchain.sh", "cargo test --workspace --locked"]

[tasks.build]
run = ["sh scripts/check-rust-toolchain.sh", "cargo build -p archy-cli --release --locked"]
