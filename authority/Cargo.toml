[package]
name = "archy-authority"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[dependencies]
archy-core = { path = "../crates/archy-core" }
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"

[[bin]]
name = "archy-authorityd"
path = "src/bin/authorityd.rs"

[[bin]]
name = "archy-review"
path = "src/bin/review.rs"

[[bin]]
name = "archy-propose"
path = "src/bin/propose.rs"
