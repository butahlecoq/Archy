<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="archy-broker">
    <allow own="org.archy.Authority1"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.archy.Authority1"/>
  </policy>
  <policy group="archy-review">
    <allow send_destination="org.archy.Authority1"/>
  </policy>
</busconfig>
