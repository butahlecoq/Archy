name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - name: Verify tracked locked dependency graph
        run: |
          cargo metadata --locked --format-version 1 --no-deps > /dev/null
          git diff --exit-code -- Cargo.lock
          git ls-files --error-unmatch Cargo.lock
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Validate checked-in schemas
        run: |
          python -m pip install jsonschema==4.26.0
          python scripts/check-schemas.py
      - name: Test A23 harness and playbook contracts
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gnupg gpg-agent gpgv
          PYTHONDONTWRITEBYTECODE=1 python3 -B -m unittest discover -s tests/acceptance/omarchy -p 'test_*.py' -v

