[workspace]
members = ["crates/archy-core", "crates/archy-cli", "crates/archy-generate", "crates/archy-eval", "crates/archy-adapters", "crates/archy-report"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
serde_path_to_error = "=0.1.20"
schemars = "=1.2.3"
serde-saphyr = "=2.0.0"
clap = { version = "=4.6.7", features = ["derive"] }
geo = { version = "=0.33.1", default-features = false }
sha2 = "=0.11.1"
rustix = { version = "=1.1.4", features = ["fs"] }
uuid = { version = "=1.29.0", features = ["v4", "serde"] }
rand_chacha = "=0.10.0"
rand_core = "=0.10.0"
