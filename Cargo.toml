[workspace]
members = ["crates/archy-core", "crates/archy-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
serde_path_to_error = "=0.1.20"
schemars = "=1.2.3"
serde-saphyr = "=2.0.0"
clap = { version = "=4.6.7", features = ["derive"] }
