[build-system]
requires = ["setuptools==80.10.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "archy-ifc-worker"
version = "0.1.0"
description = "Bounded IFC4 schematic mass export worker for Archy"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["ifcopenshell==0.9.0.post1", "pytest==9.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["archy_ifc_worker*"]
